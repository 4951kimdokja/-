<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  background:#101827;color:white;
  font-family:sans-serif;text-align:center
}
main{
  max-width:440px;margin:20px auto;
  padding:22px;background:#1e293b;
  border-radius:20px
}
h1{color:#86efac}
button,input{
  width:100%;padding:14px;margin-top:12px;
  border:0;border-radius:10px;font-size:17px
}
button{background:#4ade80;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.choice{
  background:#334155;color:white;
  border:2px solid #4ade80
}
#game{display:none}
#word{
  font-size:46px;font-weight:bold;
  padding:20px;background:#334155;
  border-radius:12px
}
#timer{
  font-size:38px;font-weight:bold;
  color:#86efac
}
#timer.low{color:#f87171}
#message{min-height:44px;line-height:1.5}
#status{color:#86efac;line-height:1.5}
#lives{
  text-align:left;background:#334155;
  padding:12px;border-radius:10px;
  line-height:1.9
}
#used{overflow-wrap:anywhere;line-height:1.6}
.small{font-size:13px;color:#cbd5e1}
</style>
</head>
<body>
<main>
<h1>끝말잇기</h1>

<section id="menu">
  <h2>게임 인원 선택</h2>
  <button class="choice" onclick="startGame(2)">2인전</button>
  <button class="choice" onclick="startGame(3)">3인전</button>
  <button class="choice" onclick="startGame(4)">4인전</button>
  <p id="status">사전을 불러오는 중...</p>
  <button id="retry" onclick="loadDictionary()" hidden>
    사전 다시 불러오기
  </button>
  <p class="small">20초 제한 · 목숨 3개 · 시간 초과 시 목숨 -1</p>
</section>

<section id="game">
  <h2 id="turn">1번 플레이어 차례</h2>
  <div id="timer">20초</div>
  <div id="lives"></div>

  <p>현재 단어</p>
  <div id="word">가</div>

  <input id="answer" placeholder="단어 입력"
    autocomplete="off">
  <button id="submit" onclick="play()">단어 입력</button>

  <p id="message"></p>
  <p>성공한 단어: <span id="score">0</span>개</p>
  <p id="used">사용한 단어: 가</p>

  <button onclick="restart()">다시 시작</button>
  <button onclick="backToMenu()">인원 선택으로</button>
</section>
</main>

<script>
const DICT_URL =
  "https://raw.githubusercontent.com/acidsound/korean_wordlist/master/wordslistUnique.txt";
const CACHE_NAME = "word-chain-dict-v2";
const STARTS = ["가","나","다","라","마","바","사","아"];
const TURN_SECONDS = 20;
const INITIAL_LIVES = 3;

const $ = id => document.getElementById(id);

let dictionary = new Set();
let firstCounts = new Map();
let dictionaryReady = false;
let loading = false;

let currentWord = "가";
let used = new Set();
let history = [];
let score = 0;
let playerCount = 2;
let currentPlayer = 0;
let lives = [];
let secondsLeft = TURN_SECONDS;
let timerId = null;
let deadline = 0;
let gameOver = false;function allowedFirstLetters(char) {
  const result = [char];
  const code = char.charCodeAt(0);

  if (code < 44032 || code > 55203) return result;

  const n = code - 44032;
  const initial = Math.floor(n / 588);
  const vowel = Math.floor((n % 588) / 28);
  const tail = n % 28;
  const newInitials = [];

  // ㄹ → ㄴ 또는 ㅇ
  if (initial === 5) {
    newInitials.push(2);

    if ([2,3,6,7,12,17,20].includes(vowel)) {
      newInitials.push(11);
    }
  }

  // ㄴ → ㅇ
  if (initial === 2 &&
      [2,3,6,7,12,17,20].includes(vowel)) {
    newInitials.push(11);
  }

  for (const newInitial of newInitials) {
    result.push(String.fromCharCode(
      44032 + newInitial * 588 + vowel * 28 + tail
    ));
  }

  return [...new Set(result)];
}

function prepareDictionary(text) {
  const words = text.split(/\r?\n/);
  const dict = new Set();
  const counts = new Map();

  for (const raw of words) {
    const w = raw.trim();

    if (!/^[가-힣]{2,}$/.test(w)) continue;
    if (dict.has(w)) continue;

    dict.add(w);
    counts.set(w[0], (counts.get(w[0]) || 0) + 1);
  }

  if (dict.size < 1000) throw new Error("사전 오류");

  dictionary = dict;
  firstCounts = counts;
  dictionaryReady = true;

  $("status").textContent =
    "사전 준비 완료! " +
    dict.size.toLocaleString() + "개 단어";
}

async function loadDictionary() {
  if (loading) return;

  loading = true;
  dictionaryReady = false;
  $("retry").hidden = true;
  $("status").textContent = "사전을 불러오는 중...";

  try {
    let text = null;

    if ("caches" in window) {
      const cache = await caches.open(CACHE_NAME);
      const saved = await cache.match(DICT_URL);

      if (saved) text = await saved.text();
    }

    if (!text) {
      const controller = new AbortController();
      const timeout = setTimeout(
        () => controller.abort(), 15000
      );

      let response;

      try {
        response = await fetch(DICT_URL, {
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      if (!response.ok) throw new Error("다운로드 실패");

      text = await response.text();

      if ("caches" in window) {
        const cache = await caches.open(CACHE_NAME);

        await cache.put(
          DICT_URL,
          new Response(text, {
            headers: {
              "Content-Type":"text/plain;charset=utf-8"
            }
          })
        );
      }
    }

    $("status").textContent = "단어 목록 처리 중...";
    await new Promise(resolve => setTimeout(resolve, 30));
    prepareDictionary(text);

  } catch (error) {
    $("status").textContent =
      "사전을 불러오지 못했어. 다시 시도해!";
    $("retry").hidden = false;
  } finally {
    loading = false;
  }
}

function hasNextWord(candidate) {
  const allowed = allowedFirstLetters(
    candidate[candidate.length - 1]
  );

  for (const first of allowed) {
    const count = firstCounts.get(first) || 0;

    if (count === 0) continue;

    let usedWithFirst = 0;

    for (const w of used) {
      if (w[0] === first) usedWithFirst++;
    }

    if (count > usedWithFirst) return true;
  }

  return false;
}

function startGame(count) {
  if (!dictionaryReady) {
    $("status").textContent =
      "사전 준비가 끝날 때까지 기다려!";
    return;
  }

  playerCount = count;
  $("menu").style.display = "none";
  $("game").style.display = "block";
  restart();
}

function render() {
  $("word").textContent = currentWord;
  $("score").textContent = score;
  $("used").textContent =
    "사용한 단어: " + history.join(", ");

  $("turn").textContent =
    (currentPlayer + 1) + "번 플레이어 차례";

  $("lives").innerHTML = lives.map((life, i) =>
    (i + 1) + "번 플레이어: " +
    (life > 0 ? "❤️".repeat(life) : "탈락")
  ).join("<br>");

  $("timer").textContent = secondsLeft + "초";
  $("timer").classList.toggle("low", secondsLeft <= 5);
}

function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
}

function startTimer() {
  stopTimer();
  secondsLeft = TURN_SECONDS;
  deadline = Date.now() + TURN_SECONDS * 1000;
  render();

  timerId = setInterval(() => {
    if (gameOver) {
      stopTimer();
      return;
    }

    secondsLeft = Math.max(
      0, Math.ceil((deadline - Date.now()) / 1000)
    );

    $("timer").textContent = secondsLeft + "초";
    $("timer").classList.toggle("low", secondsLeft <= 5);

    if (secondsLeft <= 0) timeOut();
  }, 200);
}

function nextPlayer() {
  for (let i = 0; i < playerCount; i++) {
    currentPlayer = (currentPlayer + 1) % playerCount;

    if (lives[currentPlayer] > 0) return;
  }
  }function checkWinner() {
  const alive = lives.filter(n => n > 0).length;

  if (alive <= 1) {
    gameOver = true;
    stopTimer();

    const winner = lives.findIndex(n => n > 0);

    if (winner !== -1) {
      $("turn").textContent =
        (winner + 1) + "번 플레이어 승리!";
      $("message").textContent = "게임 종료!";
    } else {
      $("turn").textContent = "게임 종료!";
      $("message").textContent = "승자가 없어!";
    }

    $("submit").disabled = true;
    $("answer").disabled = true;
    return true;
  }

  return false;
}

function timeOut() {
  if (gameOver) return;
  stopTimer();

  const loser = currentPlayer + 1;
  lives[currentPlayer]--;

  if (checkWinner()) {
    render();
    return;
  }

  nextPlayer();

  // 목숨이 깎이면 새 랜덤 시작 단어 선택
  const availableStarts = STARTS.filter(
    word => !used.has(word)
  );

  currentWord = availableStarts.length
    ? availableStarts[
        Math.floor(Math.random() * availableStarts.length)
      ]
    : STARTS[Math.floor(Math.random() * STARTS.length)];

  used.add(currentWord);
  history.push(currentWord);

  $("answer").value = "";
  $("message").textContent =
    loser + "번 플레이어 시간 초과! 목숨 -1. 새 단어로 시작!";

  startTimer();
}

function play() {
  if (gameOver || !dictionaryReady) return;

  if (Date.now() >= deadline) {
    timeOut();
    return;
  }

  const input = $("answer");
  const next = input.value.trim();

  if (!next) {
    $("message").textContent = "단어를 입력해!";
    return;
  }

  if (!/^[가-힣]+$/.test(next)) {
    $("message").textContent = "한글 단어만 입력해!";
    return;
  }

  if (next.length < 2) {
    $("message").textContent =
      "한 글자 단어는 사용할 수 없어!";
    return;
  }

  if (!dictionary.has(next)) {
    $("message").textContent =
      "단어 목록에 없는 단어야!";
    return;
  }

  if (used.has(next)) {
    $("message").textContent =
      "이미 사용한 단어야!";
    return;
  }

  const last = currentWord[currentWord.length - 1];
  const allowed = allowedFirstLetters(last);

  if (!allowed.includes(next[0])) {
    $("message").textContent =
      "'" + allowed.join("' 또는 '") +
      "'로 시작해야 해!";
    return;
  }

  if (score === 0 && !hasNextWord(next)) {
    $("message").textContent =
      "첫 번째 턴에는 한방 단어 금지!";
    return;
  }

  used.add(next);
  history.push(next);
  currentWord = next;
  score++;

  nextPlayer();
  input.value = "";
  $("message").textContent = "정답!";
  startTimer();
}

function restart() {
  stopTimer();
  gameOver = false;

  currentWord = STARTS[
    Math.floor(Math.random() * STARTS.length)
  ];

  used = new Set([currentWord]);
  history = [currentWord];
  score = 0;
  currentPlayer = 0;
  lives = Array(playerCount).fill(INITIAL_LIVES);

  $("answer").disabled = false;
  $("submit").disabled = false;
  $("answer").value = "";

  $("message").textContent =
    currentWord + "로 시작하는 단어를 입력해!";

  startTimer();
}

function backToMenu() {
  stopTimer();
  gameOver = true;
  $("game").style.display = "none";
  $("menu").style.display = "block";
}

$("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") play();
});

loadDictionary();
</script>
</body>
</html>
